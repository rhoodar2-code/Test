<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friends Juice | Manage Cart</title>
<style>
body{margin:0;background:linear-gradient(135deg,#fffdf7,#f4eddb);color:#17251b;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:720px;margin:auto;padding:14px}
.topbar{margin:8px 0 14px}
.continue{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 15px;background:#fff;border:1px solid #d6c8aa;border-radius:15px;color:#063d34;text-decoration:none;font-weight:900;box-shadow:0 4px 12px #0001}
.order-id{background:#f7f7f7;border:1px solid #ddd;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:900}
.order-id small{display:block;margin-top:4px;font-weight:600;color:#687268}
.head{background:linear-gradient(145deg,#032d27,#087343);color:#fff;border:2px solid #d8ff87;border-radius:24px;padding:22px;text-align:center;box-shadow:0 12px 30px #0003}
.head h1{margin:0;font-size:32px}.head p{margin:7px 0 0;color:#f7ffcf}
.list{margin-top:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fffdf7;border:1px solid #eadfca;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px #0001}
.name{font-size:17px;font-weight:950;color:#063d34}.sub{font-size:13px;color:#687268;margin-top:3px}
.controls{display:flex;align-items:center;gap:5px}.controls button{width:34px;height:34px;padding:0;border-radius:9px;border:0;background:#087343;color:#fff;font-weight:900}.controls .remove{background:#d9534f}.qty{min-width:24px;text-align:center;font-weight:950}
.summary{background:#fff;border:1px solid #eadfca;border-radius:18px;padding:15px;margin-top:14px}
.summary div{display:flex;justify-content:space-between;padding:7px 0;font-weight:900}
.summary .total{font-size:21px;color:#063d34}
.actions{display:grid;gap:9px;margin-top:12px}
.action{width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:13px;padding:13px;font-weight:950;font-size:15px}
.back{background:#fff;border:1px solid #d6c8aa;color:#063d34}.clear{background:#d9534f;color:#fff}
.order{background:linear-gradient(135deg,#ff8a00,#f04b18);color:#fff;border:2px solid #ffd27a}
.empty{text-align:center;background:#fffdf7;border:1px dashed #cdbf9f;border-radius:18px;padding:35px;color:#687268;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20000;align-items:center;justify-content:center;padding:10px}
.modal.open{display:flex}.modalcard{width:min(100%,470px);max-height:92vh;overflow:auto;background:#fffdf7;border-radius:22px;padding:19px;border:2px solid #d8ff87}
.modalcard h2{margin:0 0 5px;color:#063d34}.modalcard label{display:block;margin:10px 0 5px;font-weight:900;color:#063d34}
.modalcard input{width:100%;box-sizing:border-box;border:1px solid #d6c8aa;border-radius:10px;padding:11px;font:inherit}
.types{display:flex;gap:8px}.types label{flex:1;background:#fff;border:1px solid #d6c8aa;padding:12px;border-radius:10px;text-align:center}
.close{float:right;background:#e74618;color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:22px}
.order-note{margin:12px 0;padding:11px 13px;border-radius:13px;background:#f7f7f2;border:1px solid #e3dac7;color:#174b3d;font-weight:800;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="continue" href="index.html">← Continue Shopping / Back to Menu</a></div>
  <div class="order-id">Order ID: <span id="orderId">Generating...</span><small>This ID will be included in your WhatsApp order.</small></div>

  <div class="head"><h1>🛒 Manage Your Cart</h1><p>Friends Juice Corner</p></div>
  <div id="list" class="list"></div>
  <div id="summary" class="summary"></div>

  <div class="actions">
    <a class="action back" href="index.html">← Back to Menu</a>
    <button id="clear" class="action clear" type="button">🗑️ Clear Cart</button>
    <button id="order" class="action order" type="button">📲 Complete Order</button>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalcard">
    <button id="close" class="close" type="button">×</button>
    <h2>🧃 Complete Order</h2>
    <div class="order-note">📲 No online payment is required. Your order will be sent directly on WhatsApp.</div>

    <label for="name">Name</label>
    <input id="name" autocomplete="name" placeholder="Your name">

    <label for="phone">Mobile Number</label>
    <input id="phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number">

    <label>Order Type</label>
    <div class="types">
      <label><input type="radio" name="type" value="Packing" checked> 🥡 Packing</label>
      <label><input type="radio" name="type" value="Eating"> 🍽️ Eating</label>
    </div>

    <div id="ms" class="summary"></div>
    <button id="wa" class="action order" style="margin-top:12px" type="button">📲 Send Order on WhatsApp</button>
  </div>
</div>

<script>
const KEY='friendsJuiceCart';
const WA='919992238093';

// Central Order ID service
const API_URL='https://script.google.com/macros/s/AKfycbwv2lBWcuWjU93QXM5K7M5RWoe3WPheqQ4YI4UV1sJlPB1SPHxqZmRnksX5Di8l4K0/exec';
const PROJECT='FJ';
const ORDER_ID_KEY='friendsJuiceActiveOrderId';

function validOrderId(id){
  return /^FJ\d{6}\d{3}$/.test(String(id||''));
}

function setOrderId(id){
  localStorage.setItem(ORDER_ID_KEY,id);
  document.getElementById('orderId').textContent=id;
}

function ensureOrderId(){
  const c=get();
  if(!c.length){
    document.getElementById('orderId').textContent='—';
    return;
  }

  const existing=localStorage.getItem(ORDER_ID_KEY);
  if(validOrderId(existing)){
    document.getElementById('orderId').textContent=existing;
    return;
  }

  document.getElementById('orderId').textContent='Generating...';

  const callbackName='fjOrderIdCallback_'+Date.now();
  const script=document.createElement('script');
  let finished=false;

  const cleanup=()=>{
    if(script.parentNode)script.parentNode.removeChild(script);
    try{delete window[callbackName]}catch(e){}
  };

  window[callbackName]=(data)=>{
    if(finished)return;
    finished=true;
    cleanup();
    if(data && data.success && validOrderId(data.orderId)){
      setOrderId(data.orderId);
    }else{
      document.getElementById('orderId').textContent='Unable to generate';
      alert('Unable to generate Order ID. Please check your internet connection and try again.');
    }
  };

  script.onerror=()=>{
    if(finished)return;
    finished=true;
    cleanup();
    document.getElementById('orderId').textContent='Unable to generate';
    alert('Unable to connect to the Order ID server. Please try again.');
  };

  script.src=API_URL+'?project='+encodeURIComponent(PROJECT)+'&callback='+encodeURIComponent(callbackName)+'&_='+Date.now();
  document.body.appendChild(script);
}

function get(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}
}
function save(c){localStorage.setItem(KEY,JSON.stringify(c))}
function total(c){return c.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function render(){
  const c=get(), list=document.getElementById('list'), summary=document.getElementById('summary');
  if(!c.length){
    list.innerHTML='<div class="empty">🛒 Your cart is empty.<br><br><a href="index.html">Add items from menu</a></div>';
    summary.innerHTML='';
    return;
  }
  list.innerHTML=c.map((i,n)=>`
    <div class="item">
      <div><div class="name">${esc(i.name)}</div><div class="sub">₹${Number(i.price)} each • ₹${Number(i.price)*Number(i.qty)}</div></div>
      <div class="controls">
        <button type="button" onclick="chg(${n},-1)">−</button>
        <span class="qty">${Number(i.qty)}</span>
        <button type="button" onclick="chg(${n},1)">+</button>
        <button type="button" class="remove" onclick="rm(${n})">🗑️</button>
      </div>
    </div>`).join('');
  summary.innerHTML='<div class="total"><span>Order Total</span><b>₹'+total(c)+'</b></div>';
}

function chg(n,d){
  const c=get();
  if(!c[n])return;
  c[n].qty=Number(c[n].qty)+d;
  if(c[n].qty<=0)c.splice(n,1);
  save(c);render();
}
function rm(n){const c=get();c.splice(n,1);save(c);render()}

document.getElementById('clear').onclick=()=>{
  save([]);
  localStorage.removeItem(ORDER_ID_KEY);
  document.getElementById('orderId').textContent='—';
  render();
};
const modal=document.getElementById('modal');
document.getElementById('order').onclick=()=>{
  if(!get().length)return alert('Your cart is empty.');
  modal.classList.add('open');
  renderModal();
};
document.getElementById('close').onclick=()=>modal.classList.remove('open');

function renderModal(){
  const t=total(get());
  document.getElementById('ms').innerHTML='<div class="total"><span>Order Total</span><b>₹'+t+'</b></div>';
}

function valid(){
  const n=document.getElementById('name').value.trim();
  const ph=document.getElementById('phone').value.trim();
  if(!n){alert('Enter your name.');return false}
  if(!/^[6-9]\d{9}$/.test(ph)){alert('Enter a valid 10-digit mobile number.');return false}
  return true;
}

document.getElementById('wa').onclick=()=>{
  if(!valid())return;
  const c=get(), t=total(c);
  const ty=document.querySelector('input[name=type]:checked').value;
  const oid=document.getElementById('orderId').textContent;
  if(!validOrderId(oid)){
    alert('Please wait for the Order ID to be generated.');
    ensureOrderId();
    return;
  }
  const items=c.map(i=>Number(i.qty)+'×'+Number(i.price)+' '+i.name+' - ₹'+(Number(i.price)*Number(i.qty))).join('\n');
  const msg='ORDER FRIENDS JUICE\n'
    +'ORDER ID: '+oid+'\n'
    +'NAME: '+document.getElementById('name').value.trim()+'\n'
    +'MOBILE: '+document.getElementById('phone').value.trim()+'\n'
    +'TYPE: '+ty+'\n\n'
    +'ITEMS:\n'+items+'\n\n'
    +'TOTAL AMOUNT: ₹'+t;
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');
};

(function(){
  ensureOrderId();
})();

render();
</script>
</body>
</html>
